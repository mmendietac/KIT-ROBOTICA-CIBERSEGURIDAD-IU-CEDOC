# ============================================================
# mosquitto_icscert.conf — Broker ICSCERT Puerto 8883 TLS
# Kit de Robotica Educativa en Ciberseguridad v2.0
# ESCOM / CEDOC 2025
# ============================================================
#
# Uso:    activar_icscert.bat (doble clic como administrador)
# Puerto: 8883 con TLS + autenticacion obligatoria
#
# CONTROLES ACTIVOS EN ESTE BROKER:
#   TLS activo — cierra VUL-1
#   allow_anonymous false — cierra VUL-2
#   password_file — autenticacion robot01/T0k3n_Segur0!
#
# Usado en: Blue Team Retos 1, 2, 3 y 4 (flood_reto4_icscert.py)
#
# IMPORTANTE — Mosquitto 2.x:
#   message_size_limit esta deprecado en Mosquitto 2.x
#   max_packet_size 0 NO es valido en Mosquitto 2.1.2 (requiere >= 20)
#   No definir max_packet_size = sin limite (comportamiento por defecto)
# ============================================================

listener 8883
allow_anonymous false
password_file C:\mosquitto\passwd

cafile   C:\mosquitto\certs\ca.crt
certfile C:\mosquitto\certs\server.crt
keyfile  C:\mosquitto\certs\server.key
require_certificate false
tls_version tlsv1.2

# Evitar caidas bajo flood del Reto 4
# max_packet_size: no definido = sin limite (Mosquitto 2.1.2 requiere valor >= 20)
# NO poner max_packet_size 0 — genera error "must be >= 20" en Mosquitto 2.1.2
max_inflight_messages 0
max_queued_messages 0

log_dest file C:\mosquitto\logs\mosquitto_icscert.log
log_type error
log_type warning
log_type information
