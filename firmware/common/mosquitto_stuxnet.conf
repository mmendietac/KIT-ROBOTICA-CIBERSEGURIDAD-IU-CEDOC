# ============================================================
# mosquitto_stuxnet.conf — Broker STUXNET Puerto 1883
# Kit de Robotica Educativa en Ciberseguridad v2.0
# ESCOM / CEDOC 2025
# ============================================================
#
# Uso:    activar_stuxnet.bat (doble clic como administrador)
# Puerto: 1883 sin TLS sin autenticacion
#
# VULNERABILIDADES ACTIVAS EN ESTE BROKER:
#   [VUL-1] Puerto 1883 sin TLS — tráfico legible con Wireshark
#   [VUL-2] allow_anonymous true — cualquiera puede publicar
#   Usadas en Retos 1, 2, 3 y 4 Red Team
#
# NOTA: message_size_limit esta deprecado en Mosquitto 2.x
#   max_packet_size 0 NO es valido en Mosquitto 2.1.2 (requiere >= 20)
#   No definir max_packet_size = sin limite de tamaño (comportamiento por defecto)
# ============================================================

listener 1883
allow_anonymous true
# max_packet_size: no definido = sin limite (Mosquitto 2.1.2 requiere valor >= 20)
# NO poner max_packet_size 0 — genera error "must be >= 20" en Mosquitto 2.1.2

log_dest file C:\mosquitto\logs\mosquitto_stuxnet.log
log_type error
log_type warning
log_type information
